        let currentTab = 1;
        let userAnswers = {};
        let isSubmitted = false;

        // Initialize App
        window.onload = function() {
            renderQuestions();
        };

        // Switch between Lessons
        function switchTab(tabIndex) {
            currentTab = tabIndex;
            isSubmitted = false;
            
            // Update Tab UI
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                if (idx + 1 === tabIndex) {
                    btn.className = "tab-btn px-4 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 flex items-center space-x-2 bg-military-700 text-yellow-300 border border-yellow-500 shadow-md";
                } else {
                    btn.className = "tab-btn px-4 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 flex items-center space-x-2 bg-white text-slate-700 hover:bg-slate-200 border border-slate-300";
                }
            });

            // Hide Score Banner
            document.getElementById('scoreBanner').classList.add('hidden');
            
            // Render questions for tab
            renderQuestions();
        }

        // Render Question List
        function renderQuestions() {
            const container = document.getElementById('quiz-container');
            const questions = quizData[currentTab];
            container.innerHTML = '';

            questions.forEach((q, qIndex) => {
                const selectedOpt = userAnswers[q.id];

                // Classification Badge Styles
                let badgeStyle = "bg-blue-100 text-blue-800 border-blue-300";
                if(q.level === "Thông hiểu") badgeStyle = "bg-emerald-100 text-emerald-800 border-emerald-300";
                if(q.level === "Vận dụng") badgeStyle = "bg-amber-100 text-amber-800 border-amber-300";

                let cardMarkup = `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 md:p-6 transition hover:shadow-md" id="card-${q.id}">
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <span class="font-bold text-military-700 text-sm md:text-base">Câu ${qIndex + 1}</span>
                            <span class="text-xs px-2.5 py-1 rounded-full font-semibold border ${badgeStyle}">${q.level}</span>
                        </div>
                        <h2 class="text-slate-800 font-semibold text-base md:text-lg mb-4 leading-relaxed">${q.question}</h2>
                        
                        <div class="space-y-2.5">
                `;

                const optLabels = ['A', 'B', 'C', 'D'];
                q.options.forEach((optText, optIdx) => {
                    let optionClass = "border-slate-200 hover:border-military-600 hover:bg-emerald-50/50 text-slate-700";
                    let radioChecked = selectedOpt === optIdx ? "checked" : "";
                    let iconMarkup = "";

                    // If Quiz Submitted -> Show Results Styling
                    if (isSubmitted) {
                        if (optIdx === q.correct) {
                            // Correct Option
                            optionClass = "bg-emerald-100 border-emerald-500 text-emerald-900 font-semibold";
                            iconMarkup = `<i class="fa-solid fa-circle-check text-emerald-600 ml-auto text-lg"></i>`;
                        } else if (selectedOpt === optIdx && selectedOpt !== q.correct) {
                            // User Selected Wrong Option
                            optionClass = "bg-rose-100 border-rose-500 text-rose-900 font-semibold";
                            iconMarkup = `<i class="fa-solid fa-circle-xmark text-rose-600 ml-auto text-lg"></i>`;
                        } else {
                            optionClass = "border-slate-200 text-slate-400 opacity-70";
                        }
                    } else if (selectedOpt === optIdx) {
                        optionClass = "border-military-600 bg-emerald-50 text-military-900 font-semibold ring-1 ring-military-600";
                    }

                    cardMarkup += `
                        <label class="flex items-center p-3 md:p-3.5 rounded-lg border-2 cursor-pointer transition-all duration-150 ${optionClass}">
                            <input type="radio" 
                                   name="question-${q.id}" 
                                   value="${optIdx}" 
                                   ${radioChecked}
                                   ${isSubmitted ? 'disabled' : ''}
                                   onclick="selectOption('${q.id}', ${optIdx})" 
                                   class="w-4 h-4 text-military-700 focus:ring-military-600 border-slate-300">
                            <span class="ml-3 text-sm md:text-base flex-grow">
                                <strong class="mr-1.5">${optLabels[optIdx]}.</strong> ${optText}
                            </span>
                            ${iconMarkup}
                        </label>
                    `;
                });

                cardMarkup += `
                        </div>
                    </div>
                `;

                container.innerHTML += cardMarkup;
            });

            updateProgress();
        }

        // Handle Option Selection
        function selectOption(qId, optIdx) {
            if (isSubmitted) return;
            userAnswers[qId] = optIdx;
            updateProgress();
            
            // Minimal UI update without full re-render
            const qData = quizData[currentTab].find(q => q.id === qId);
            if(qData) {
                const card = document.getElementById(`card-${qId}`);
                if(card) {
                    const labels = card.querySelectorAll('label');
                    labels.forEach((lbl, idx) => {
                        if(idx === optIdx) {
                            lbl.className = "flex items-center p-3 md:p-3.5 rounded-lg border-2 cursor-pointer transition-all duration-150 border-military-600 bg-emerald-50 text-military-900 font-semibold ring-1 ring-military-600";
                        } else {
                            lbl.className = "flex items-center p-3 md:p-3.5 rounded-lg border-2 cursor-pointer transition-all duration-150 border-slate-200 hover:border-military-600 hover:bg-emerald-50/50 text-slate-700";
                        }
                    });
                }
            }
        }

        // Update Answered Progress Counter
        function updateProgress() {
            const currentQuestions = quizData[currentTab];
            let answered = 0;
            currentQuestions.forEach(q => {
                if (userAnswers[q.id] !== undefined) answered++;
            });

            document.getElementById('answeredCount').innerText = answered;
            document.getElementById('lessonTotalCount').innerText = currentQuestions.length;
        }

        // Submit and Calculate Score
        function submitQuiz() {
            const currentQuestions = quizData[currentTab];
            let correctCount = 0;

            currentQuestions.forEach(q => {
                if (userAnswers[q.id] === q.correct) {
                    correctCount++;
                }
            });

            isSubmitted = true;
            renderQuestions();

            // Calculate Score (Scale 10)
            const score10 = ((correctCount / currentQuestions.length) * 10).toFixed(1);

            // Display Score Banner
            const scoreBanner = document.getElementById('scoreBanner');
            const scoreCircle = document.getElementById('scoreCircle');
            const scoreTitle = document.getElementById('scoreTitle');
            const scoreDetail = document.getElementById('scoreDetail');

            scoreBanner.classList.remove('hidden');
            scoreCircle.innerText = `${score10}/10`;
            scoreDetail.innerText = `Bạn đã trả lời đúng ${correctCount}/${currentQuestions.length} câu hỏi.`;

            if (score10 >= 8.0) {
                scoreTitle.innerText = "Xuất sắc! 🎉";
                scoreTitle.className = "font-bold text-emerald-700 text-lg";
            } else if (score10 >= 6.5) {
                scoreTitle.innerText = "Khá tốt! 👍";
                scoreTitle.className = "font-bold text-blue-700 text-lg";
            } else if (score10 >= 5.0) {
                scoreTitle.innerText = "Đạt yêu cầu! 😊";
                scoreTitle.className = "font-bold text-amber-700 text-lg";
            } else {
                scoreTitle.innerText = "Cần cố gắng thêm! 💪";
                scoreTitle.className = "font-bold text-rose-700 text-lg";
            }

            // Scroll Smoothly to Top Result
            scoreBanner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Reset Current Quiz Lesson
        function resetQuiz() {
            const currentQuestions = quizData[currentTab];
            currentQuestions.forEach(q => {
                delete userAnswers[q.id];
            });

            isSubmitted = false;
            document.getElementById('scoreBanner').classList.add('hidden');
            renderQuestions();
        }
    </script>
</body>
</html>
